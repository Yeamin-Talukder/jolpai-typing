<!doctype html>

    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu ^
      --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,480 ^
      --virtual-time-budget=8000 --screenshot="%CD%\.github\assets\banner.png" "%CD%\scripts\readme-banner.html"

<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Lexend+Deca:wght@400;600&family=Noto+Sans+Bengali:wght@500;600&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 480px; overflow: hidden; }
  body { background: #1e2118; color: #d1d0c5; font-family: 'Lexend Deca', 'Segoe UI', sans-serif; position: relative; }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(640px 380px at 92% 12%, rgba(163,184,74,.17), transparent 70%),
                radial-gradient(560px 360px at 0% 100%, rgba(163,184,74,.09), transparent 70%); }
  .left { position: absolute; left: 84px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 24px; }
  .brand svg { width: 104px; height: 104px; color: #a3b84a; flex: none; }
  .name { font-size: 68px; font-weight: 600; color: #e6e5da; letter-spacing: -1.5px; line-height: 1; }
  .name b { color: #a3b84a; font-weight: 600; }
  .bn-name { font-family: 'Noto Sans Bengali', 'Nirmala UI', sans-serif; font-size: 30px; color: #7d8466; margin-top: 10px; }
  .tag { margin-top: 36px; font-size: 27px; line-height: 1.45; color: #c9c8bb; }
  .tag b { color: #a3b84a; font-weight: 600; }
  .pills { margin-top: 30px; display: flex; gap: 12px; }
  .pills span { border: 2px solid rgba(163,184,74,.35); color: #b9c47e; border-radius: 999px; padding: 7px 18px; font-size: 19px; }
  .right { position: absolute; right: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .card { background: rgba(0,0,0,.22); border: 1.5px solid rgba(163,184,74,.18); border-radius: 22px; padding: 22px 24px; }
  .typed { font-family: 'Noto Sans Bengali', 'Nirmala UI', sans-serif; font-size: 34px; font-weight: 500; display: flex; align-items: center; white-space: nowrap; }
  .typed .done { color: #e6e5da; } .typed .todo { color: #5c6248; }
  .caret { width: 3px; height: 40px; background: #a3b84a; border-radius: 2px; margin: 0 2px; }
  .stats { display: flex; gap: 28px; margin-top: 16px; font-family: 'JetBrains Mono', monospace; }
  .stats div { color: #7d8466; font-size: 16px; } .stats b { display: block; color: #a3b84a; font-size: 34px; font-weight: 500; }
  .kb { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; }
  .row:nth-child(2) { margin-left: 22px; } .row:nth-child(3) { margin-left: 44px; }
  .k { width: 40px; height: 40px; border-radius: 10px; background: rgba(209,208,197,.07); display: grid; place-items: center;
    font-family: 'Noto Sans Bengali', 'Nirmala UI', sans-serif; font-size: 18px; color: rgba(209,208,197,.4); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .k.lit { background: #a3b84a; color: #1e2118; box-shadow: 0 0 0 4px rgba(163,184,74,.25), inset 0 -3px 0 rgba(0,0,0,.2); }
  .k.home { position: relative; } .k.home::after { content: ''; position: absolute; bottom: 6px; width: 10px; height: 2px; border-radius: 2px; background: rgba(209,208,197,.4); }
</style>
</head>

        <div class="name">jolpai <b>typing</b></div>
