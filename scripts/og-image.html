<!doctype html>
<!--
  Source of public/og-image.png, the 1200x630 social preview card.
  It is not part of the site build. To regenerate it after changing this file:

    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu ^
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 ^
      --virtual-time-budget=8000 --screenshot="%CD%\public\og-image.png" "%CD%\scripts\og-image.html"

  (Any Chromium browser works the same way.) The mark below is a placeholder:
  swap in the final logo when it lands.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Lexend+Deca:wght@400;600&family=Noto+Sans+Bengali:wght@500;600&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #1e2118;
    color: #d1d0c5;
    font-family: 'Lexend Deca', 'Segoe UI', sans-serif;
    position: relative;
  }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(700px 420px at 88% 18%, rgba(163,184,74,.16), transparent 70%),
                radial-gradient(600px 380px at 0% 100%, rgba(163,184,74,.08), transparent 70%); }
  .letters { position: absolute; right: 56px; top: 44px; display: grid; grid-template-columns: repeat(5, 72px);
    gap: 14px; font-family: 'Noto Sans Bengali', 'Nirmala UI', sans-serif; }
  .letters span { width: 72px; height: 72px; border-radius: 16px; border: 2px solid rgba(163,184,74,.18);
    display: grid; place-items: center; font-size: 34px; color: rgba(209,208,197,.28); }
  .letters span.lit { border-color: #a3b84a; background: rgba(163,184,74,.16); color: #a3b84a; }
  .wrap { position: absolute; left: 80px; top: 74px; right: 80px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand svg { width: 92px; height: 92px; color: #a3b84a; }
  .name { font-size: 76px; font-weight: 600; color: #a3b84a; letter-spacing: -1px; line-height: 1; }
  .bn-name { font-family: 'Noto Sans Bengali', 'Nirmala UI', sans-serif; font-size: 34px; color: #7d8466; margin-top: 8px; }
  h1 { margin-top: 56px; font-size: 44px; font-weight: 600; line-height: 1.22; color: #e6e5da; max-width: 1040px; }
  h1 b { color: #a3b84a; font-weight: 600; }
  .typed { margin-top: 30px; display: flex; align-items: center; font-family: 'Noto Sans Bengali', 'Nirmala UI', sans-serif;
    font-size: 40px; font-weight: 500; }
  .typed .done { color: #e6e5da; }
  .typed .todo { color: #5c6248; }
  .caret { width: 4px; height: 46px; background: #a3b84a; border-radius: 2px; margin: 0 2px; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 54px; display: flex; justify-content: space-between;
    align-items: center; font-size: 25px; color: #7d8466; }
  .pills { display: flex; gap: 14px; }
  .pills span { border: 2px solid rgba(163,184,74,.35); color: #b9c47e; border-radius: 999px; padding: 8px 20px; font-size: 22px; }
  .url { font-family: 'JetBrains Mono', monospace; font-size: 22px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="letters" aria-hidden="true">
    <span>ক</span><span>খ</span><span>গ</span><span>ঘ</span><span>ঙ</span>
    <span>চ</span><span>ছ</span><span class="lit">জ</span><span>ঝ</span><span>ঞ</span>
  </div>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="18" rx="9" ry="11" fill="currentColor"/><path d="M16 7c2-4 6-5 9-4-1 4-5 6-9 4z" fill="#7d8466"/></svg>
      <div>
        <div class="name">Jolpai Type</div>
        <div class="bn-name">জলপাই টাইপ</div>
      </div>
    </div>
    <h1>Practise <b>Bangla (Bijoy)</b> and English typing, and learn Bijoy touch typing.</h1>
    <div class="typed"><span class="done">আমি বাংলায় টাই</span><span class="caret"></span><span class="todo">প করতে ভালোবাসি</span></div>
  </div>
  <div class="foot">
    <div class="pills"><span>free</span><span>no install</span><span>any keyboard</span></div>
    <div class="url">yeamin-talukder.github.io/jolpai-type</div>
  </div>
</body>
</html>
